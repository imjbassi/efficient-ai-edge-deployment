services:
  edge-inference-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edge_inference_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=info
    volumes:
      # Updating files avoids image rebuilds; restart the service to reload weights.
      - ./models:/app/models
    # Deployment limits; these are not benchmark measurements.
    deploy:
      resources:
        limits:
          cpus: "2.0"          # Limit to 2 CPU cores
          memory: 512M         # Configured ceiling; validate on the target hardware.
    restart: always
